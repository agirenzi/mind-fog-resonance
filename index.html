<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mind Fog — Generative Resonance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body{background:#020617;margin:0;font-family:ui-monospace,monospace}</style>
</head>
<body>
<div id="app" class="min-h-screen flex items-center justify-center p-4 text-slate-200"></div>
<script>
const CLIPS = [
  "https://elevenlabsusercontent.com/database/workspace/04848e7300384938b42011a82b902dbf/content_generation/jTu48jMvoUfgsm735Ts6/STrPtr2sNLuTcZHaKYxU/content.mp3?Expires=1795176000&KeyName=assets-cdn-key-1&Signature=WgccDxZJiQJ8i4mY9arzNbYiuMM="
];

const app = document.getElementById('app');
let audio, playing = false;

function render() {
  app.innerHTML = `
  <div class="w-full max-w-2xl bg-slate-900/90 border border-slate-800 rounded-2xl p-6 flex flex-col gap-6">
    <div class="flex items-center justify-between border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-xl font-bold text-white">Mind Fog Resonance</h1>
        <p class="text-xs text-slate-400">ElevenLabs ambient stream (makeshift continuous)</p>
      </div>
      <button id="play" class="px-4 py-2 rounded-xl font-semibold ${playing ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40' : 'bg-blue-600 text-white'}">${playing ? 'Suspend' : 'Initiate'}</button>
    </div>
    <div class="relative h-56 bg-slate-950 rounded-xl border border-slate-800 flex items-center justify-center">
      <canvas id="viz" width="500" height="220" class="w-full h-full"></canvas>
      <div class="absolute top-3 left-3 text-[10px] text-slate-500 uppercase tracking-widest">Resonance Topology</div>
    </div>
    <div class="text-xs text-slate-400">
      Playing a looping ambient clip generated with ElevenLabs Music.<br>
      Additional variations are being prepared for crossfading.
    </div>
    <div class="text-[10px] text-slate-500">Source: ElevenLabs eleven_music_v2_5 · sparse ambient, zero-grid, no drums</div>
  </div>`;
  document.getElementById('play').onclick = toggle;
}

function toggle() {
  if (!audio) {
    audio = new Audio(CLIPS[0]);
    audio.loop = true;
    audio.volume = 0.7;
  }
  if (playing) {
    audio.pause();
    playing = false;
  } else {
    audio.play();
    playing = true;
  }
  render();
}

render();
</script>
</body>
</html>
